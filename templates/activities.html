{% extends "base.html" %}
{% block title %}Actividades · Paridad{% endblock %}
{% block content %}
<div class="page-heading"><h1>Actividades</h1></div>
<div class="management-layout">
  <aside class="card" aria-labelledby="activity-tools">
    <h2 id="activity-tools">Agregar</h2>
    <div class="stack creation-buttons">
      <a href="/admin/activities/crear/modulo" class="button secondary" data-record-action aria-haspopup="dialog">Crear módulo</a>
      <a href="/admin/activities/crear/lenguaje" class="button secondary" data-record-action aria-haspopup="dialog">Agregar lenguaje</a>
    </div>
  </aside>
  <section class="card">
    <h2>Módulos</h2>
    <div class="module-directory">
      {% for module in modules %}
      <a href="/admin/activities/modulos/{{ module.id }}" class="module-tile" data-record-action aria-haspopup="dialog"
         data-module-id="{{ module.id }}">
        <span class="record-summary-text"><span>{{ module.code|upper }}</span><small>{{ module.title }}</small></span>
        <span class="module-chevron" aria-hidden="true">›</span>
      </a>
      {% else %}<p class="empty">Aún no hay módulos.</p>{% endfor %}
    </div>
  </section>
</div>
{% endblock %}
