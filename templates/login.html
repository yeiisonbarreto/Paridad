{% extends "base.html" %}
{% block title %}Inicio de sesión · Paridad{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<section class="card login-form" aria-labelledby="login-heading">
  <h1 id="login-heading">Inicio de sesión</h1>
  {% if error %}<p class="callout alert" role="alert">{{ error }}</p>{% endif %}
  <form action="/login" method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Usuario<input name="username" autocomplete="username" maxlength="64" required></label>
    <label>Contraseña<input type="password" name="password" autocomplete="current-password" maxlength="128" required></label>
    <button type="submit" class="button">Ingresar</button>
  </form>
</section>
{% endblock %}
