limit_req_zone $binary_remote_addr zone=paridad:10m rate=30r/s;

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:paridadTLS:10m;
    include /etc/nginx/paridad-proxy.conf;
}
