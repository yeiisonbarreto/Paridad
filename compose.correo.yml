# Optional direct delivery for review notices on the university server.
services:
  app:
    environment:
      PARIDAD_NOTICE_DELIVERY: direct
      PARIDAD_NOTICE_FROM: ${PARIDAD_NOTICE_FROM:?Configura el remitente de los avisos en .env}
      PARIDAD_MAIL_DOMAIN: ${PARIDAD_MAIL_DOMAIN:?Configura el dominio de correo en .env}

  worker:
    environment:
      PARIDAD_NOTICE_DELIVERY: direct
      PARIDAD_NOTICE_FROM: ${PARIDAD_NOTICE_FROM:?Configura el remitente de los avisos en .env}
      PARIDAD_MAIL_DOMAIN: ${PARIDAD_MAIL_DOMAIN:?Configura el dominio de correo en .env}
    networks: !override
      - database
      - mail_submission
    depends_on:
      mail-out:
        condition: service_started

  mail-out:
    image: ghcr.io/bokysan/postfix:v5.2.1@sha256:0632783c64183446c4edeae9092a2e015fdc0c4e8a3976bdf8878a7fc2146361
    environment:
      ALLOWED_SENDER_DOMAINS: ${PARIDAD_MAIL_DOMAIN:?Configura el dominio de correo en .env}
      POSTFIX_myhostname: ${PARIDAD_MAIL_HOSTNAME:?Configura el nombre del servidor de correo en .env}
      POSTFIX_inet_protocols: ipv4
      POSTFIX_mynetworks: "127.0.0.1/32,${PARIDAD_MAIL_SUBNET:-172.30.62.0/28}"
      POSTFIX_smtpd_client_restrictions: permit_mynetworks,reject
      POSTFIX_smtpd_relay_restrictions: permit_mynetworks,reject
      POSTFIX_smtp_tls_security_level: encrypt
      POSTFIX_milter_default_action: tempfail
      ANONYMIZE_EMAILS: mask
      DKIM_BACKEND: rspamd
      DKIM_AUTOGENERATE: "yes"
      DKIM_SELECTOR: paridad
      RSPAMD_dkim_signing__use_esld: "false"
    volumes:
      - mail_queue:/var/spool/postfix
      - mail_dkim:/var/lib/rspamd/dkim
    networks:
      - mail_submission
      - mail_egress
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  mail_submission:
    internal: true
    ipam:
      config:
        - subnet: ${PARIDAD_MAIL_SUBNET:-172.30.62.0/28}

volumes:
  mail_queue:
  mail_dkim:
