x-runtime: &runtime
  image: paridad:local
  environment: &runtime-env
    DB_HOST: db
    DB_USER: paridad_app
    DB_PASSWORD: ${PARIDAD_DB_PASSWORD:?Configura PARIDAD_DB_PASSWORD en .env}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
    MOODLE_FRAME_ORIGINS: ${MOODLE_FRAME_ORIGINS:-}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=16m
  networks:
    - database

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paridad_owner
      POSTGRES_DB: paridad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "paridad_owner", "-d", "paridad"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *runtime
    build: .
    command: ["python", "-m", "paridad.cli", "migrate"]
    environment:
      DB_HOST: db
      DB_USER: paridad_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      PARIDAD_DB_PASSWORD: ${PARIDAD_DB_PASSWORD:?Configura PARIDAD_DB_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *runtime
    pull_policy: never
    environment:
      <<: *runtime-env
      TRUST_PROXY_IP: "true"
      PARIDAD_SCOPE_LIMIT: ${PARIDAD_SCOPE_LIMIT:-250}
      PARIDAD_TIME_ZONE: ${PARIDAD_TIME_ZONE:-America/Bogota}
      CLIENT_DETERRENCE: ${CLIENT_DETERRENCE:-true}
    networks:
      - database
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          from paridad.config import PUBLIC_HOST;
          req = urllib.request.Request('http://127.0.0.1:8000/healthz', headers={'Host': PUBLIC_HOST});
          urllib.request.urlopen(req, timeout=3).close()
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

  worker:
    <<: *runtime
    pull_policy: never
    command: ["python", "-m", "paridad.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:${PARIDAD_HTTP_PORT:-8787}:8080"
    volumes:
      - ./deploy/nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy.conf:/etc/nginx/paridad-proxy.conf:ro
    networks:
      - edge
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  database:
    internal: true
  edge:

volumes:
  pgdata:
